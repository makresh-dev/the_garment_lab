services:
  postgres:
    image: postgres:16
    container_name: garmentlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: garmentlab
      POSTGRES_USER: garmentlab
      POSTGRES_PASSWORD: garmentlab_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: